<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo de Picaportes</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzExMSIgcng9IjgiLz48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSIxOCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjYzg2MjFhIiBzdHJva2Utd2lkdGg9IjgiLz48cmVjdCB4PSI2MiIgeT0iNDYiIHdpZHRoPSIyMiIgaGVpZ2h0PSI4IiByeD0iMyIgZmlsbD0iI2M4NjIxYSIvPjwvc3ZnPg==">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Barlow:wght@400;500&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--bg2:#181818;--bg3:#222;--border:#2e2e2e;--accent:#d4711f;--al:#e8833a;--text:#e8e0d8;--muted:#7a7268;--dim:#4a4540;--tbg:#2a2218;--tbd:#3d3020;--zero:#8c3a3a;}
body.light{--bg:#f4f1ed;--bg2:#fff;--bg3:#ede9e3;--border:#d8d2c8;--text:#2a2218;--muted:#7a6a58;--dim:#b0a090;--tbg:#f0ebe3;--tbd:#d8cfc4;--zero:#c0392b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;min-height:100vh;}

#page-catalog,#page-form{max-width:560px;margin:0 auto;}
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);}
.topbar-inner{max-width:560px;margin:0 auto;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;}
#page-catalog{display:block;}
#page-form{display:none;}

.topbar-title{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:0.16em;color:var(--accent);text-transform:uppercase;white-space:nowrap;text-align:center;}
.topbar-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center;}

.btn{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;border:none;cursor:pointer;padding:5px 10px;border-radius:4px;transition:all .15s;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{background:var(--al);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-consulta{opacity:0.35;cursor:not-allowed !important;pointer-events:none;}

.summary-chip{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;padding:3px 7px;border-radius:4px;background:var(--bg2);border:1px solid var(--border);color:var(--muted);white-space:nowrap;cursor:default;}
.summary-chip span{color:var(--text);font-weight:700;}
.summary-chip.alert{border-color:var(--zero);color:var(--zero);cursor:pointer;}
.summary-chip.alert.consulta{cursor:not-allowed;opacity:0.35;}

.catalog-controls{padding:8px 12px 0;}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:12px;pointer-events:none;}
.search-box{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:7px 10px 7px 30px;color:var(--text);font-family:'Barlow',sans-serif;font-size:12px;outline:none;}
.search-box::placeholder{color:var(--dim);}
.divider{height:1px;background:var(--border);margin:0 12px;}

/* TABLE */
.tbl-wrap{padding:0 8px 20px;}
.tbl{width:100%;border-collapse:collapse;font-family:'Barlow Condensed',sans-serif;font-size:11px;}
.tbl thead tr{border-bottom:1px solid var(--accent);}
.tbl th{font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding:4px 5px;text-align:left;white-space:nowrap;border-right:1px solid var(--border);}
.tbl th:last-child{border-right:none;}
.tbl tbody tr.tbl-main{border-bottom:1px solid var(--border);cursor:default;}
.tbl tbody tr.tbl-main:hover td{background:var(--tbg);}
.tbl tbody tr.tbl-odd td{background:var(--bg3);}
.tbl tbody tr.tbl-photo-row td{padding:0;border-bottom:1px solid var(--border);}
#reorder-toggle-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.tbl tbody tr.tbl-main.reorder-mode{cursor:grab;touch-action:none;}
.tbl tbody tr.tbl-main.reorder-mode:active{cursor:grabbing;}
.tbl tbody tr.tbl-main.dragging{opacity:0.4;}
.tbl tbody tr.tbl-main.drag-over-top{box-shadow:inset 0 2px 0 var(--accent);}
.tbl tbody tr.tbl-main.drag-over-bottom{box-shadow:inset 0 -2px 0 var(--accent);}
.reorder-handle{display:none;color:var(--muted);font-size:13px;padding-right:2px;}
.tbl tbody tr.tbl-main.reorder-mode .reorder-handle{display:inline-block;}
.tbl td{padding:4px 5px;vertical-align:middle;color:var(--text);line-height:1.3;border-right:1px solid var(--border);}
.tbl td:last-child{border-right:none;}
.tbl td.td-desc{font-size:12px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tbl td.td-code{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;color:var(--muted);white-space:nowrap;}

/* STOCK CONTROLS */
.qbtns{display:inline-flex;align-items:center;gap:1px;}
.qbtn{background:var(--bg3);border:1px solid var(--border);border-radius:2px;color:var(--muted);cursor:pointer;font-size:11px;font-weight:700;width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:1;}
.qbtn:active{background:var(--accent);color:#fff;border-color:var(--accent);}
.qbtn.consulta{opacity:0.35;cursor:not-allowed;pointer-events:none;}
.qval{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;min-width:18px;text-align:center;display:inline-block;}
.stock-u{color:var(--text);}
.stock-zero{color:var(--zero);font-weight:700;}

/* PHOTO TOGGLE BTN */
.photo-btn{background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--dim);cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;padding:2px 6px;transition:all .15s;white-space:nowrap;}
.photo-btn:hover{border-color:var(--muted);color:var(--muted);}
.photo-btn.open{border-color:var(--accent);color:var(--accent);}

/* PHOTO EXPAND ROW */
.photo-expand{display:none;padding:8px 12px;}
.photo-expand.open{display:block;}
.photo-expand img{max-width:100%;max-height:240px;object-fit:contain;border-radius:4px;border:1px solid var(--border);background:var(--bg3);}

/* ACTION BUTTONS */
.abtn{background:transparent;border:1px solid transparent;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:2px 5px;border-radius:3px;white-space:nowrap;transition:all .15s;}
.abtn-edit{color:var(--accent);border-color:var(--accent);}
.abtn-edit:hover{background:var(--accent);color:#fff;}
.abtn-edit:active{background:var(--al);border-color:var(--al);color:#fff;}
.abtn-del{color:var(--dim);border-color:var(--border);}
.abtn-del:hover{color:#e05555;border-color:#e05555;}
.abtn-del:active{background:#e05555;color:#fff;border-color:#e05555;}
.abtn.consulta{opacity:0.35;cursor:not-allowed;pointer-events:none;}

/* EMPTY */
.empty-state{text-align:center;padding:40px 20px;}
.empty-icon{font-size:32px;margin-bottom:8px;}
.empty-state p{font-size:12px;color:var(--muted);}

/* FORM */
.form-wrap{padding:14px 12px 60px;}
.fgrp{margin-bottom:12px;}
.fgrp-section{margin-bottom:12px;border:1px solid var(--accent);border-radius:7px;padding:10px 12px;opacity:0.85;}
.flabel{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.flabel-section{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;text-align:center;}
.finput{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:9px 10px;color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;outline:none;}
.finput:focus{border-color:var(--accent);}
.finput::placeholder{color:var(--dim);}

/* STOCK FORM */
.stock-inputs{display:flex;align-items:center;gap:8px;justify-content:center;}
.stock-input-group{display:flex;flex-direction:column;align-items:center;gap:4px;}
.stock-input-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;}
.stock-number{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:8px 10px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;outline:none;width:80px;text-align:center;}
.stock-number:focus{border-color:var(--accent);}
.stock-adj-btn{background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--muted);cursor:pointer;font-size:16px;font-weight:700;width:32px;height:32px;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;transition:all .15s;flex-shrink:0;}
.stock-adj-btn:hover{border-color:var(--accent);color:var(--accent);}
.stock-adj-btn:active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* SAVE BTN */
.btn-save{width:100%;padding:12px;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;margin-top:4px;display:block;}
.btn-save:active{background:var(--al);}

/* MOSAIC */
.mosaic-grid mosaic-small{padding:6px 8px 24px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.mosaic-grid{padding:6px 8px 24px;display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.mosaic-grid.mosaic-small{grid-template-columns:1fr 1fr 1fr;}
.mosaic-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s;}
.mosaic-card:hover{border-color:var(--accent);}
.mosaic-card.no-photo{border-style:dashed;opacity:0.65;}
.mosaic-img-wrap{width:100%;aspect-ratio:4/3;background:var(--bg3);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.mosaic-img-wrap img{width:100%;height:100%;object-fit:cover;}
.mosaic-no-img{font-size:20px;color:var(--dim);}
.mosaic-info{padding:4px 5px 5px;display:flex;flex-direction:column;gap:2px;}
.mosaic-code{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
.mosaic-desc{font-family:'Barlow',sans-serif;font-size:10px;font-weight:500;color:var(--text);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.mosaic-stock{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;color:var(--muted);}

/* MOSAIC MODAL */
.mosaic-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;padding:16px;}
.mosaic-modal.open{display:flex;}
.mosaic-modal-inner{max-width:520px;width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;position:relative;}
.mosaic-modal-img{width:100%;max-height:55vh;object-fit:contain;background:var(--bg3);}
.mosaic-modal-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;}
.mosaic-modal-desc{font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;color:var(--text);}
.mosaic-modal-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.mosaic-modal-actions{display:flex;gap:6px;margin-top:4px;}
.mosaic-modal-close{position:absolute;top:10px;right:12px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-size:16px;cursor:pointer;border-radius:4px;padding:3px 9px;font-family:'Barlow Condensed',sans-serif;font-weight:700;}
.mosaic-modal-close:hover{border-color:var(--accent);color:var(--accent);}
.mosaic-tag{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--tbg);border:1px solid var(--tbd);color:var(--muted);}

/* VIEW TOGGLE */
.view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;flex-shrink:0;}
.view-toggle button{background:transparent;border:none;padding:5px 9px;font-family:'Barlow Condensed',sans-serif;font-size:13px;cursor:pointer;color:var(--muted);line-height:1;}
.view-toggle button.active{background:var(--accent);color:#fff;}
.view-toggle button:not(.active):hover{color:var(--accent);}

/* LOADING */
.loading-state{text-align:center;padding:40px 20px;font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--muted);letter-spacing:0.08em;}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);border:1px solid var(--accent);color:var(--text);padding:7px 16px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:12px;z-index:999;transition:transform .25s;white-space:nowrap;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>

<!-- ===== CATALOG PAGE ===== -->
<div id="page-catalog">
  <div class="topbar">
    <div class="topbar-inner">
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;">
        <button class="btn btn-outline" onclick="exportBackup()" title="Backup">&#11015;</button>
        <label class="btn btn-outline" id="btn-restaurar" style="cursor:pointer;" title="Restaurar">&#11014;<input type="file" accept=".json" style="display:none" onchange="importBackup(event)"></label>
        <a href="index.html" class="btn btn-ghost" style="text-decoration:none;">&#8962;</a>
        <button class="btn btn-ghost" onclick="salir()" title="Cerrar sesión">Salir</button>
        <div class="topbar-title">Picaportes</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" onclick="exportPDF()">PDF</button>
        <button class="btn btn-outline" onclick="exportCSV()">CSV</button>
        <button class="btn btn-outline" onclick="exportFotos()">&#8595; Fotos</button>
        <button id="undo-btn" class="btn btn-ghost" onclick="performUndo()" disabled style="opacity:0.35;" title="Sin acciones para deshacer">&#8630;</button>
        <button id="redo-btn" class="btn btn-ghost" onclick="performRedo()" disabled style="opacity:0.35;" title="Sin acciones para rehacer">&#8631;</button>
        <div class="view-toggle">
          <button id="vt-table" class="active" onclick="setViewMode('table')" title="Vista tabla">☰</button>
          <button id="vt-mosaic" onclick="setViewMode('mosaic')" title="Vista mosaico">⊟</button>
        </div>
        <button class="btn btn-ghost" onclick="toggleTheme()">&#9788;</button>
        <div style="width:1px;height:20px;background:var(--border);flex-shrink:0;"></div>
        <button class="btn btn-accent" id="btn-agregar" onclick="openForm(null)">+ Nuevo</button>
      </div>
    </div>
  </div>

  <!-- SUMMARY BAR -->
  <div style="max-width:560px;margin:0 auto;padding:6px 12px 0;">
    <div id="summary-bar" style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding-bottom:6px;"></div>
  </div>

  <div class="catalog-controls">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;">Buscar</span>
      <div style="position:relative;flex:1;">
        <span class="search-icon">&#128269;</span>
        <input class="search-box" id="search-input" type="text" placeholder="Buscar descripcion o codigo..." oninput="debouncedRender()">
      </div>
      <button class="btn btn-ghost" id="reorder-toggle-btn" onclick="toggleReorderMode()" title="Reordenar manualmente las filas">⇅</button>
    </div>
  </div>
  <div class="divider" style="margin-top:8px;"></div>
  <div id="item-list" class="tbl-wrap"></div>
</div>

<!-- ===== FORM PAGE ===== -->
<div id="page-form">
  <div class="topbar">
    <div class="topbar-inner" style="flex-direction:row;justify-content:space-between;">
      <div class="topbar-title" id="form-title-bar">Nuevo Picaporte</div>
      <button class="btn btn-ghost" onclick="closeForm()">&#8592; Volver</button>
    </div>
  </div>
  <div class="form-wrap">
    <!-- CODIGO + DESCRIPCION -->
    <div class="fgrp-section">
      <div class="flabel-section">Identificacion</div>
      <div style="display:flex;gap:8px;">
        <div style="flex-shrink:0;width:80px;">
          <div class="flabel">Codigo</div>
          <input class="finput" id="ff-codigo" type="text" placeholder="ej: A12" maxlength="4" style="text-transform:uppercase;">
        </div>
        <div style="flex:1;min-width:0;">
          <div class="flabel">Descripcion</div>
          <input class="finput" id="ff-desc" type="text" placeholder="ej: Picaporte 20cm inox...">
        </div>
      </div>
    </div>

    <!-- STOCK -->
    <div class="fgrp-section">
      <div class="flabel-section">Stock</div>
      <div style="display:flex;gap:16px;justify-content:center;align-items:center;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div class="stock-input-lbl" style="color:var(--muted);">Unidades</div>
          <div style="display:flex;align-items:center;gap:6px;">
            <button type="button" class="stock-adj-btn" onclick="adjFormStock('ff-stock',-1)">−</button>
            <input class="stock-number" id="ff-stock" type="number" value="0" min="0">
            <button type="button" class="stock-adj-btn" onclick="adjFormStock('ff-stock',1)">+</button>
          </div>
        </div>
        <div style="color:var(--dim);font-size:20px;font-weight:300;padding-top:18px;">/</div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
          <div class="stock-input-lbl" style="color:var(--muted);">Cajas</div>
          <div style="display:flex;align-items:center;gap:6px;">
            <button type="button" class="stock-adj-btn" onclick="adjFormStock('ff-cajas',-1)">−</button>
            <input class="stock-number" id="ff-cajas" type="number" value="0" min="0">
            <button type="button" class="stock-adj-btn" onclick="adjFormStock('ff-cajas',1)">+</button>
          </div>
        </div>
      </div>
      <!-- CANTIDAD x CAJA -->
      <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px;">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;text-align:center;">Cantidad x Caja</div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;">
          <input class="stock-number" id="ff-cxc-new" type="number" min="1" placeholder="ej: 5" style="width:70px;font-size:14px;padding:6px 8px;">
          <button type="button" onclick="addCxcOption()" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:4px;cursor:pointer;white-space:nowrap;" onmouseover="this.style.background='var(--accent)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='var(--accent)'">+ Agregar</button>
          <div id="cxc-chips" style="display:flex;gap:5px;flex-wrap:wrap;"></div>
          <button type="button" onclick="deleteCxcOption()" title="Eliminar opción seleccionada" style="background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--dim);cursor:pointer;font-size:13px;font-weight:700;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;transition:all .15s;" onmouseover="this.style.borderColor='#e05555';this.style.color='#e05555'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--dim)'">✕</button>
        </div>
      </div>
    </div>

    <!-- FOTO -->
    <div class="fgrp-section">
      <div class="flabel-section">Foto</div>
      <div style="display:flex;align-items:center;gap:8px;justify-content:center;">
        <label style="cursor:pointer;">

<div class="toast" id="toast"></div>

<script>
// ===== SUPABASE CONFIG =====
var SUPA_URL = 'https://ddowemygrrbjoqkyguhq.supabase.co';
var SUPA_KEY = 'sb_publishable_TF6bRm78aN2sWLKSLIiObg_1fKt5oQb';
var SUPA_TABLE = 'picaportes';

// ===== SESSION CHECK =====
var torriSession = localStorage.getItem('torri_session');
var torriMode = localStorage.getItem('torri_mode')||'completo';
var torriSessionTime = localStorage.getItem('torri_session_time');
if(torriSession && torriSessionTime && (Date.now()-parseInt(torriSessionTime))>=8*60*60*1000){
  localStorage.removeItem('torri_session');
  localStorage.removeItem('torri_mode');
  localStorage.removeItem('torri_session_time');
  torriSession=null;
  torriMode='completo';
}
var isConsulta = (torriMode==='consulta');
if(!torriSession && torriMode !== 'consulta'){ window.location.replace('index.html'); }

// ===== SUPABASE HELPERS =====
function supaHeaders(){
  return {
    'apikey': SUPA_KEY,
    'Authorization': 'Bearer '+(torriSession||SUPA_KEY),
    'Content-Type': 'application/json'
  };
}

// ===== STATE =====
var models = [];
var editingId = null;
var formPhoto = null;
var formCxc = 20;
var darkMode = true;
var viewMode = 'table';
var DEFAULT_CXC_OPTIONS = [10,20];
var cxcOptions = [];
var reorderMode = false;

// ===== UNDO =====
var UNDO_LIMIT = 20;
var undoHistory = [];
var redoHistory = [];

function pushUndo(label){
  undoHistory.push({label:label,models:JSON.parse(JSON.stringify(models))});
  if(undoHistory.length>UNDO_LIMIT) undoHistory.shift();
  redoHistory=[];
  updateUndoBtn();updateRedoBtn();
}
function performUndo(){
  if(!undoHistory.length) return;
  redoHistory.push({label:undoHistory[undoHistory.length-1].label,models:JSON.parse(JSON.stringify(models))});
  if(redoHistory.length>UNDO_LIMIT) redoHistory.shift();
  var snap=undoHistory.pop();
  models=snap.models;
  renderList();
  showToast('Deshecho: '+snap.label);
  updateUndoBtn();updateRedoBtn();
}
function performRedo(){
  if(!redoHistory.length) return;
  undoHistory.push({label:redoHistory[redoHistory.length-1].label,models:JSON.parse(JSON.stringify(models))});
  if(undoHistory.length>UNDO_LIMIT) undoHistory.shift();
  var snap=redoHistory.pop();
  models=snap.models;
  renderList();
  showToast('Rehecho: '+snap.label);
  updateUndoBtn();updateRedoBtn();
}
function updateUndoBtn(){
  var b=document.getElementById('undo-btn');
  if(b){var h=undoHistory.length>0;b.disabled=!h;b.style.opacity=h?'1':'0.35';b.title=h?'Deshacer: '+undoHistory[undoHistory.length-1].label:'Sin acciones para deshacer';}
}
function updateRedoBtn(){
  var b=document.getElementById('redo-btn');
  if(b){var h=redoHistory.length>0;b.disabled=!h;b.style.opacity=h?'1':'0.35';b.title=h?'Rehacer: '+redoHistory[redoHistory.length-1].label:'Sin acciones para rehacer';}
}

// ===== LOCALSTORAGE (theme + viewmode only) =====
try{var t=localStorage.getItem('torri_theme');if(t==='light'){darkMode=false;document.body.classList.add('light');}}catch(e){}
try{var vm=localStorage.getItem('picaportes_viewmode');if(vm==='mosaic')viewMode='mosaic';}catch(e){}

// ===== SUPABASE HELPERS =====
function supaHeaders(){
  return {
    'apikey': SUPA_KEY,
    'Authorization': 'Bearer '+(torriSession||SUPA_KEY),
    'Content-Type': 'application/json'
  };
}
function handle401(res){
  if(res.status===401){
    localStorage.removeItem('torri_session');
    localStorage.removeItem('torri_session_time');
    window.location.href='index.html';
    return true;
  }
  return false;
}

// ===== LOAD FROM SUPABASE =====
function loadFromSupabase(){
  document.getElementById('item-list').innerHTML='<div class="loading-state">Cargando...</div>';
  fetch(SUPA_URL+'/rest/v1/'+SUPA_TABLE+'?select=*',{headers:supaHeaders()})
    .then(function(res){
      if(handle401(res)) return null;
      if(!res.ok) throw new Error('HTTP '+res.status);
      return res.json();
    })
    .then(function(rows){
      if(!rows) return;
      models=[];
      cxcOptions=[];
      for(var i=0;i<rows.length;i++){
        var row=rows[i];
        if(String(row.id).indexOf('config_')===0){
          if(row.id==='config_cxc_options' && Array.isArray(row.data)){
            cxcOptions=row.data;
          }
        } else {
          if(row.data) models.push(row.data);
        }
      }
      if(!cxcOptions.length) cxcOptions=DEFAULT_CXC_OPTIONS.slice();
      applyConsultaMode();
      renderList();
    })
    .catch(function(e){showToast('Error al cargar: '+e.message);});
}

// ===== SAVE MODEL TO SUPABASE =====
function supaUpsertModel(m){
  return fetch(SUPA_URL+'/rest/v1/'+SUPA_TABLE,{
    method:'POST',
    headers:Object.assign({},supaHeaders(),{'Prefer':'resolution=merge-duplicates'}),
    body:JSON.stringify({id:m.id,data:m})
  }).then(function(res){if(handle401(res))return null;if(!res.ok)throw new Error('HTTP '+res.status);return res;});
}

// ===== DELETE MODEL FROM SUPABASE =====
function supaDeleteModel(id){
  return fetch(SUPA_URL+'/rest/v1/'+SUPA_TABLE+'?id=eq.'+encodeURIComponent(id),{
    method:'DELETE',
    headers:supaHeaders()
  }).then(function(res){if(handle401(res))return null;if(!res.ok)throw new Error('HTTP '+res.status);return res;});
}

// ===== SAVE CXC OPTIONS =====
function supaSaveCxcOptions(){
  fetch(SUPA_URL+'/rest/v1/'+SUPA_TABLE,{
    method:'POST',
    headers:Object.assign({},supaHeaders(),{'Prefer':'resolution=merge-duplicates'}),
    body:JSON.stringify({id:'config_cxc_options',data:cxcOptions})
  }).then(function(res){if(handle401(res))return null;if(!res.ok)throw new Error('HTTP '+res.status);})
  .catch(function(e){showToast('Error guardando config: '+e.message);});
}

// ===== HELPERS =====
function getModel(id){for(var i=0;i<models.length;i++){if(models[i].id===id)return models[i];}return null;}
function esc(str){if(str==null)return'';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// ===== CONSULTA MODE =====
function applyConsultaMode(){
  if(!isConsulta) return;
  // Topbar buttons
  var btnAgregar=document.getElementById('btn-agregar');
  if(btnAgregar) btnAgregar.classList.add('btn-consulta');
  var btnRestaura=document.getElementById('btn-restaurar');
  if(btnRestaura) btnRestaura.classList.add('btn-consulta');
  var btnReorder=document.getElementById('reorder-toggle-btn');
  if(btnReorder) btnReorder.classList.add('btn-consulta');
}

// ===== FORM STOCK ADJ =====
function adjFormStock(fieldId,delta){
  var inp=document.getElementById(fieldId);
  if(!inp)return;
  inp.value=Math.max(0,(parseInt(inp.value)||0)+delta);
}

// ===== PHOTO =====
function handlePhoto(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(ev){formPhoto=ev.target.result;renderPhotoPreview();};r.readAsDataURL(f);
}
function renderPhotoPreview(){
  var w=document.getElementById('photo-wrap'),p=document.getElementById('photo-preview'),rb=document.getElementById('remove-photo-btn');
  if(formPhoto){p.src=formPhoto;w.style.display='block';if(rb)rb.style.display='inline-flex';}
  else{p.src='';w.style.display='none';document.getElementById('ff-photo').value='';if(rb)rb.style.display='none';}
}
function removePhoto(){formPhoto=null;renderPhotoPreview();}

// ===== CXC CHIPS =====
function renderCxcChips(){
  var wrap=document.getElementById('cxc-chips');if(!wrap)return;
  var html='';
  for(var i=0;i<cxcOptions.length;i++){
    var v=cxcOptions[i];
    var active=v===formCxc;
    html+='<button type="button" onclick="selectCxc('+v+')" style="font-family:\'Barlow Condensed\',sans-serif;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid '+(active?'var(--accent)':'var(--border)')+';background:'+(active?'var(--accent)':'transparent')+';color:'+(active?'#fff':'var(--muted)')+';cursor:pointer;transition:all .15s;">'+v+'</button>';
  }
  wrap.innerHTML=html;
}
function selectCxc(v){
  if(isConsulta) return;
  formCxc=v; renderCxcChips();
}
function deleteCxcOption(){
  if(isConsulta) return;
  if(cxcOptions.length<=1){showToast('Debe quedar al menos una opción');return;}
  var idx=cxcOptions.indexOf(formCxc);
  if(idx===-1)return;
  cxcOptions.splice(idx,1);
  formCxc=cxcOptions[Math.max(0,idx-1)];
  supaSaveCxcOptions();
  renderCxcChips();
}
function addCxcOption(){
  if(isConsulta) return;
  var inp=document.getElementById('ff-cxc-new');
  var v=parseInt(inp.value);
  if(!v||v<1){showToast('Ingresa un número válido');return;}
  if(cxcOptions.indexOf(v)!==-1){selectCxc(v);inp.value='';return;}
  cxcOptions.push(v);
  cxcOptions.sort(function(a,b){return a-b;});
  supaSaveCxcOptions();
  formCxc=v; inp.value='';
  renderCxcChips();
}

// ===== NAVIGATION =====
function openForm(id){
  if(isConsulta) return;
  editingId=id||null;formPhoto=null;formCxc=20;
  document.getElementById('ff-desc').value='';
  document.getElementById('ff-codigo').value='';
  document.getElementById('ff-stock').value=0;
  document.getElementById('ff-cajas').value=0;
  document.getElementById('form-title-bar').textContent=id?'Editar Picaporte':'Nuevo Picaporte';
  document.getElementById('btn-save').textContent=id?'Guardar Cambios':'Guardar Picaporte';
  if(id){
    var m=getModel(id);
    if(m){
      document.getElementById('ff-desc').value=m.descripcion||'';
      document.getElementById('ff-codigo').value=m.codigo||'';
      document.getElementById('ff-stock').value=m.stock||0;
      document.getElementById('ff-cajas').value=m.cajas||0;
      formCxc=m.cxc||20;
      formPhoto=m.photo||null;
    }
  }
  renderCxcChips();
  renderPhotoPreview();
  document.getElementById('page-catalog').style.display='none';
  document.getElementById('page-form').style.display='block';
  window.scrollTo(0,0);
}
function closeForm(){
  document.getElementById('page-form').style.display='none';
  document.getElementById('page-catalog').style.display='block';
  window.scrollTo(0,0);
}

// ===== SAVE =====
function saveModel(){
  var desc=document.getElementById('ff-desc').value.trim();
  if(!desc){showToast('Ingresa una descripcion');document.getElementById('ff-desc').focus();return;}
  var m={
    id:editingId||String(Date.now()),
    descripcion:desc,
    codigo:(document.getElementById('ff-codigo').value.trim().toUpperCase())||'',
    stock:parseInt(document.getElementById('ff-stock').value)||0,
    cajas:parseInt(document.getElementById('ff-cajas').value)||0,
    cxc:formCxc,
    photo:formPhoto,
    createdAt:editingId?(getModel(editingId)||{}).createdAt||Date.now():Date.now()
  };
  if(editingId){
    for(var i=0;i<models.length;i++){if(models[i].id===editingId){pushUndo('Editar: '+desc);models[i]=m;break;}}
    showToast('Picaporte actualizado');
  } else {
    pushUndo('Agregar: '+desc);models.push(m);
    showToast('Picaporte guardado');
  }
  supaUpsertModel(m).catch(function(e){showToast('Error al guardar: '+e.message);});
  renderList();closeForm();
}

// ===== DELETE =====
function deleteModel(id){
  if(isConsulta) return;
  var idx=-1;for(var i=0;i<models.length;i++){if(models[i].id===id){idx=i;break;}}
  if(idx===-1)return;
  pushUndo('Eliminar: '+(models[idx].descripcion||'picaporte'));
  models.splice(idx,1);
  supaDeleteModel(id).catch(function(e){showToast('Error al eliminar: '+e.message);});
  renderList();
  showToast('Picaporte eliminado');
}

// ===== QUICK STOCK =====
function adjustStock(btn,modelId,field,delta){
  if(isConsulta) return;
  var m=getModel(modelId);if(!m)return;
  if(field==='cajas') m.cajas=Math.max(0,(m.cajas||0)+delta);
  else m.stock=Math.max(0,(m.stock||0)+delta);
  pushUndo('Stock: '+esc(m.descripcion)+' '+(field==='cajas'?'Cajas':'Uds')+' '+(delta>0?'+':'')+delta);
  supaUpsertModel(m).catch(function(e){showToast('Error al guardar: '+e.message);});
  var span=btn.parentNode.querySelector('.qval');
  if(span){
    var newVal=field==='cajas'?m.cajas:m.stock;
    span.textContent=newVal;
    span.className='qval '+(newVal===0?'stock-zero':'stock-u');
  }
  renderSummary();
  var tc=document.getElementById('tbl-total-'+modelId);
  if(tc){
    var cxc=m.cxc||20;
    var total=(m.cajas||0)*cxc+(m.stock||0);
    tc.textContent=total;
    tc.className=total===0?'stock-zero':'stock-u';
  }
}

// ===== PHOTO TOGGLE =====
function togglePhoto(id){
  var expand=document.getElementById('ph-'+id);
  var btn=document.getElementById('phbtn-'+id);
  if(!expand)return;
  var open=expand.className==='photo-expand open';
  // Close any other open photo first
  var allExpands=document.querySelectorAll('.photo-expand.open');
  for(var i=0;i<allExpands.length;i++){
    if(allExpands[i].id!=='ph-'+id){
      allExpands[i].className='photo-expand';
      var otherId=allExpands[i].id.replace('ph-','');
      var otherBtn=document.getElementById('phbtn-'+otherId);
      if(otherBtn){otherBtn.className='photo-btn';otherBtn.textContent='▼ Foto';}
    }
  }
  expand.className=open?'photo-expand':'photo-expand open';
  if(btn){btn.className=open?'photo-btn':'photo-btn open';btn.textContent=open?'▼ Foto':'▲ Foto';}
}

// ===== RESET STOCK =====
var resetStockPending=false;
function resetAllStock(){
  if(isConsulta) return;
  if(resetStockPending){
    resetStockPending=false;
    pushUndo('Reset stock general');
    for(var i=0;i<models.length;i++){
      models[i].stock=0;models[i].cajas=0;
      supaUpsertModel(models[i]).catch(function(e){showToast('Error: '+e.message);});
    }
    renderList();showToast('Stock reseteado a cero');return;
  }
  resetStockPending=true;
  var chip=document.getElementById('reset-stock-chip');
  if(chip){chip.textContent='Seguro?';chip.style.background='var(--zero)';chip.style.color='#fff';chip.style.borderColor='var(--zero)';}
  setTimeout(function(){document.addEventListener('click',cancelResetStock,{once:true,capture:true});},0);
}
function cancelResetStock(e){
  var chip=document.getElementById('reset-stock-chip');
  if(chip&&chip.contains(e.target))return;
  resetStockPending=false;
  if(chip){chip.textContent='Reset stock';chip.style.background='';chip.style.color='';chip.style.borderColor='';}
}

// ===== SUMMARY =====
function renderSummary(){
  var total=models.length,units=0,cajas=0,totalUds=0;
  for(var i=0;i<models.length;i++){
    var mi=models[i];
    units+=(mi.stock||0);
    cajas+=(mi.cajas||0);
    totalUds+=(mi.cajas||0)*(mi.cxc||20)+(mi.stock||0);
  }
  var resetCls='summary-chip alert'+(isConsulta?' consulta':'');
  document.getElementById('summary-bar').innerHTML=
    '<div class="summary-chip">Modelos: <span>'+total+'</span></div>'+
    '<div class="summary-chip">Unidades: <span>'+units+'</span></div>'+
    '<div class="summary-chip">Cajas: <span>'+cajas+'</span></div>'+
    '<div class="summary-chip">Total: <span>'+totalUds+'</span></div>'+
    '<div class="'+resetCls+'" id="reset-stock-chip" title="Resetear todo el stock a cero">Reset stock</div>';
  var rc=document.getElementById('reset-stock-chip');
  if(rc&&!isConsulta) rc.addEventListener('click',resetAllStock);
}

// ===== FILTER =====
function getFiltered(){
  var q=(document.getElementById('search-input').value||'').toLowerCase().trim();
  var out=[];
  for(var i=0;i<models.length;i++){
    var m=models[i];
    if(q){
      var matchDesc=(m.descripcion||'').toLowerCase().indexOf(q)!==-1;
      var matchCod=(m.codigo||'').toLowerCase().indexOf(q)!==-1;
      if(!matchDesc&&!matchCod)continue;
    }
    out.push(m);
  }
  out.sort(function(a,b){
    if(a.order!=null && b.order!=null) return a.order-b.order;
    return(a.createdAt||0)-(b.createdAt||0);
  });
  return out;
}

// ===== DEBOUNCE =====
var searchTimer=null;
function debouncedRender(){
  if(reorderMode){
    reorderMode=false;
    var rb=document.getElementById('reorder-toggle-btn');
    if(rb) rb.classList.remove('active');
  }
  if(searchTimer)clearTimeout(searchTimer);searchTimer=setTimeout(renderList,180);
}

// ===== VIEW MODE =====
function setViewMode(mode){
  viewMode=mode;
  try{localStorage.setItem('picaportes_viewmode',mode);}catch(e){}
  if(mode==='mosaic' && reorderMode){
    reorderMode=false;
    var rb=document.getElementById('reorder-toggle-btn');
    if(rb) rb.classList.remove('active');
  }
  document.getElementById('vt-table').className=mode==='table'?'active':'';
  document.getElementById('vt-mosaic').className=mode==='mosaic'?'active':'';
  var il=document.getElementById('item-list');
  if(il)il.className=mode==='mosaic'?'':'tbl-wrap';
  renderList();
}

// ===== RENDER MOSAIC =====
function renderMosaic(filtered){
  var list=document.getElementById('item-list');
  if(filtered.length===0){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">&#128273;</div><p>'+(models.length===0?'No hay picaportes cargados.<br>Toca <b>+ Agregar</b> para empezar.':'No hay resultados.')+'</p></div>';
    return;
  }
  var html='<div class="mosaic-grid mosaic-small">';
  for(var j=0;j<filtered.length;j++){
    var m=filtered[j],mid=m.id;
    var hasPhoto=!!m.photo;
    var imgHtml=hasPhoto?'<img src="'+m.photo+'" loading="lazy" alt="'+esc(m.descripcion||'')+'">':'<span class="mosaic-no-img">&#128273;</span>';
    var stockStr='Uds: '+(m.stock||0)+'  Cajas: '+(m.cajas||0);
    html+='<div class="mosaic-card'+(hasPhoto?'':' no-photo')+'" onclick="openMosaicModal(\''+mid+'\')">'
      +'<div class="mosaic-img-wrap">'+imgHtml+'</div>'
      +'<div class="mosaic-info">'
      +(m.codigo?'<div class="mosaic-code">'+esc(m.codigo)+'</div>':'')
      +'<div class="mosaic-desc">'+(m.descripcion?esc(m.descripcion):'Sin descripcion')+'</div>'
      +'<div class="mosaic-stock">'+stockStr+'</div>'
      +'</div></div>';
  }
  html+='</div>';
  list.innerHTML=html;
}

// ===== MOSAIC MODAL =====
function openMosaicModal(id){
  var m=getModel(id);if(!m)return;
  var modal=document.getElementById('mosaic-modal');
  var imgEl=document.getElementById('mosaic-modal-img');
  var descEl=document.getElementById('mosaic-modal-desc');
  var metaEl=document.getElementById('mosaic-modal-meta');
  var editBtn=document.getElementById('mosaic-modal-edit');
  var delBtn=document.getElementById('mosaic-modal-del');
  if(m.photo){imgEl.src=m.photo;imgEl.style.display='block';}
  else{imgEl.src='';imgEl.style.display='none';}
  descEl.textContent=(m.descripcion||'Sin descripcion');
  var metaHtml='';
  if(m.codigo) metaHtml+='<span class="mosaic-tag">'+esc(m.codigo)+'</span>';
  metaHtml+='<span class="mosaic-tag" style="color:var(--text);">Uds: '+(m.stock||0)+'</span>';
  metaHtml+='<span class="mosaic-tag" style="color:var(--text);">Cajas: '+(m.cajas||0)+'</span>';
  metaEl.innerHTML=metaHtml;
  if(isConsulta){
    editBtn.classList.add('consulta');
    delBtn.classList.add('consulta');
  } else {
    editBtn.classList.remove('consulta');
    delBtn.classList.remove('consulta');
    editBtn.onclick=function(){closeMosaicModal();openForm(id);};
    delBtn.onclick=function(){closeMosaicModal();deleteModel(id);};
  }
  modal.className='mosaic-modal open';
  document.body.style.overflow='hidden';
}
function closeMosaicModal(e){

}

// ===== RENDER LIST =====

    list.className='';
    renderMosaic(filtered);
    return;
  }
  list.className='tbl-wrap';
  if(filtered.length===0){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">&#128273;</div><p>'+(models.length===0?'No hay picaportes cargados.<br>Toca <b>+ Agregar</b> para empezar.':'No hay resultados.')+'</p></div>';
    return;
  }
  var qc=isConsulta?' consulta':'';
  var rmCls=reorderMode?' reorder-mode':'';
  var handleTh=reorderMode?'<th></th>':'';
  var html='<table class="tbl"><thead><tr>'
    +handleTh+'<th>Cod</th><th>Descripcion</th><th>Uds</th><th>Cajas</th><th>Total</th><th></th>'
    +'</tr></thead><tbody>';

    var oddCls=(isOdd?'tbl-main tbl-odd':'tbl-main')+rmCls;
    var uCls=(m.stock||0)===0?'stock-zero':'stock-u';
    var cCls=(m.cajas||0)===0?'stock-zero':'stock-u';
    var stockCell='<div class="qbtns">'
      +'<button class="qbtn'+qc+'" onclick="adjustStock(this,\''+mid+'\',\'stock\',-1)">-</button>'
      +'<span class="qval '+uCls+'">'+(m.stock||0)+'</span>'
      +'<button class="qbtn'+qc+'" onclick="adjustStock(this,\''+mid+'\',\'stock\',1)">+</button>'
      +'</div>';
    var cajasCell='<div class="qbtns">'
      +'<button class="qbtn'+qc+'" onclick="adjustStock(this,\''+mid+'\',\'cajas\',-1)">-</button>'
      +'<span class="qval '+cCls+'">'+(m.cajas||0)+'</span>'
      +'<button class="qbtn'+qc+'" onclick="adjustStock(this,\''+mid+'\',\'cajas\',1)">+</button>'
      +'</div>';
    var total=(m.cajas||0)*(m.cxc||20)+(m.stock||0);
    var totalCls=total===0?'stock-zero':'stock-u';
    var photoBtn=m.photo?'<button class="photo-btn" id="phbtn-'+mid+'" onclick="togglePhoto(\''+mid+'\')">▼ Foto</button>':'';
    var actCell='<div style="display:flex;gap:3px;align-items:center;justify-content:flex-end;flex-wrap:nowrap;">'
      +photoBtn
      +'<button class="abtn abtn-edit'+qc+'" onclick="openForm(\''+mid+'\')">Editar</button>'
      +'<button class="abtn abtn-del'+qc+'" onclick="deleteModel(\''+mid+'\')" title="Eliminar">✕</button>'
      +'</div>';
    var handleTd=reorderMode?'<td class="reorder-handle">&#8942;&#8942;</td>':'';
    var draggableAttr=reorderMode?' draggable="true" data-order-id="'+mid+'"':'';
    html+='<tr class="'+oddCls+'"'+draggableAttr+'>'
      +handleTd
      +'<td class="td-code">'+(m.codigo?esc(m.codigo):'<span style="color:var(--dim)">—</span>')+'</td>'
      +'<td class="td-desc">'+esc(m.descripcion||'—')+'</td>'
      +'<td style="white-space:nowrap;">'+stockCell+'</td>'
      +'<td style="white-space:nowrap;">'+cajasCell+'</td>'
      +'<td style="text-align:center;font-family:\'Barlow Condensed\',sans-serif;font-weight:700;font-size:12px;" id="tbl-total-'+mid+'" class="'+totalCls+'">'+total+'</td>'
      +'<td style="text-align:right;">'+actCell+'</td>'

        +'<div class="photo-expand" id="ph-'+mid+'">'

// ===== REORDENAR MANUAL =====
function toggleReorderMode(){
  if(isConsulta) return;
  var hasSearch=(document.getElementById('search-input').value||'').trim().length>0;
  if(!reorderMode && (viewMode!=='table' || hasSearch)){
    showToast('El orden manual solo está disponible en vista Tabla, sin búsqueda activa');
    return;
  }
  reorderMode=!reorderMode;
  var btn=document.getElementById('reorder-toggle-btn');
  if(btn) btn.classList.toggle('active', reorderMode);
  renderList();
  if(reorderMode) showToast('Modo reordenar activado: arrastrá las filas para moverlas');
}

var _dragSrcId=null;
var _touchSrcEl=null, _touchCurrentOver=null;

function attachReorderListeners(){
  if(!reorderMode) return;
  var rows=document.querySelectorAll('.tbl-main.reorder-mode');
  for(var i=0;i<rows.length;i++){
    var row=rows[i];
    row.addEventListener('dragstart', _onDragStart);
    row.addEventListener('dragover', _onDragOver);
    row.addEventListener('dragleave', _onDragLeave);
    row.addEventListener('drop', _onDrop);
    row.addEventListener('dragend', _onDragEnd);
    row.addEventListener('touchstart', _onTouchStart, {passive:false});
    row.addEventListener('touchmove', _onTouchMove, {passive:false});
    row.addEventListener('touchend', _onTouchEnd);
  }
}

function _onTouchStart(e){
  _touchSrcEl=this;
  _dragSrcId=this.getAttribute('data-order-id');
  this.classList.add('dragging');
}
function _onTouchMove(e){
  if(!_touchSrcEl) return;
  e.preventDefault();
  var touch=e.touches[0];
  var el=document.elementFromPoint(touch.clientX, touch.clientY);
  var row=el ? el.closest('.tbl-main.reorder-mode') : null;
  if(_touchCurrentOver && _touchCurrentOver!==row){
    _touchCurrentOver.classList.remove('drag-over-top','drag-over-bottom');
  }
  if(row && row!==_touchSrcEl){
    var rect=row.getBoundingClientRect();
    var midY=rect.top+rect.height/2;
    row.classList.remove('drag-over-top','drag-over-bottom');
    row.classList.add(touch.clientY<midY ? 'drag-over-top' : 'drag-over-bottom');
    _touchCurrentOver=row;
  }
}
function _onTouchEnd(e){
  if(!_touchSrcEl) return;
  if(_touchCurrentOver && _touchCurrentOver!==_touchSrcEl){
    var targetId=_touchCurrentOver.getAttribute('data-order-id');
    var rect=_touchCurrentOver.getBoundingClientRect();
    var touch=e.changedTouches[0];
    var before=(touch.clientY<rect.top+rect.height/2);
    _touchCurrentOver.classList.remove('drag-over-top','drag-over-bottom');
    _reorderModels(_dragSrcId, targetId, before);
  }
  _touchSrcEl.classList.remove('dragging');
  _touchSrcEl=null; _touchCurrentOver=null; _dragSrcId=null;
}
function _onDragStart(e){
  _dragSrcId=this.getAttribute('data-order-id');
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain', _dragSrcId); }catch(err){}
}
function _onDragOver(e){
  e.preventDefault();
  if(this.getAttribute('data-order-id')===_dragSrcId) return;
  var rect=this.getBoundingClientRect();
  var midY=rect.top+rect.height/2;
  this.classList.remove('drag-over-top','drag-over-bottom');
  this.classList.add(e.clientY<midY ? 'drag-over-top' : 'drag-over-bottom');
}
function _onDragLeave(){
  this.classList.remove('drag-over-top','drag-over-bottom');
}
function _onDrop(e){
  e.preventDefault();
  var targetId=this.getAttribute('data-order-id');
  this.classList.remove('drag-over-top','drag-over-bottom');
  if(!_dragSrcId || _dragSrcId===targetId) return;
  var rect=this.getBoundingClientRect();
  var midY=rect.top+rect.height/2;
  var before=(e.clientY<midY);
  _reorderModels(_dragSrcId, targetId, before);
}
function _onDragEnd(){
  this.classList.remove('dragging');
  var all=document.querySelectorAll('.tbl-main');
  for(var i=0;i<all.length;i++) all[i].classList.remove('drag-over-top','drag-over-bottom');
  _dragSrcId=null;
}
function _reorderModels(srcId, targetId, before){
  if(isConsulta) return;
  var ordered=getFiltered();
  var srcIdx=-1, targetIdx=-1;
  for(var i=0;i<ordered.length;i++){
    if(ordered[i].id===srcId) srcIdx=i;
    if(ordered[i].id===targetId) targetIdx=i;
  }
  if(srcIdx===-1||targetIdx===-1) return;
  pushUndo('Reordenar picaportes');
  var moved=ordered.splice(srcIdx,1)[0];
  var insertAt=-1;
  for(var k=0;k<ordered.length;k++){ if(ordered[k].id===targetId){ insertAt=k; break; } }
  if(!before) insertAt+=1;
  ordered.splice(insertAt,0,moved);
  for(var j=0;j<ordered.length;j++){
    ordered[j].order=j;
    for(var n=0;n<models.length;n++){
      if(models[n].id===ordered[j].id){
        models[n].order=j;
        supaUpsertModel(models[n]).catch(function(e){showToast('Error al guardar orden: '+e.message);});
        break;
      }
    }
  }
  renderList();
}

// ===== EXPORT =====
function getExportModels(){
  return getFiltered();
}

function exportBackup(){
  try{
    var payload=JSON.stringify({models:models.slice(),cxcOptions:cxcOptions.slice()},null,2);
    var blob=new Blob([payload],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='backup-picaportes-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    showToast('Backup descargado ('+models.length+' modelos)');
  }catch(e){showToast('Error al exportar backup');}
}

function importBackup(e){
  if(isConsulta) return;
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var raw=JSON.parse(ev.target.result);
      var importedModels=raw.models||[];
      var importedCxc=raw.cxcOptions||null;
      if(!Array.isArray(importedModels)) throw new Error();
      // upsert all models
      var promises=[];
      for(var j=0;j<importedModels.length;j++){
        promises.push(supaUpsertModel(importedModels[j]));
      }
      // merge into memory
      var existIds={};
      for(var i=0;i<models.length;i++) existIds[models[i].id]=i;
      var added=0,updated=0;
      for(var k=0;k<importedModels.length;k++){
        var imp=importedModels[k];
        if(existIds[imp.id]!==undefined){models[existIds[imp.id]]=imp;updated++;}
        else{models.push(imp);added++;}
      }
      if(importedCxc&&Array.isArray(importedCxc)){
        cxcOptions=importedCxc;
        supaSaveCxcOptions();
      }
      renderList();
      showToast('Restaurado: '+added+' nuevo'+(added!==1?'s':'')+', '+updated+' actualizado'+(updated!==1?'s':''));
      Promise.all(promises).catch(function(e){showToast('Error en upsert: '+e.message);});
    }catch(err){showToast('Archivo inválido');}
    e.target.value='';
  };
  reader.readAsText(file);
}

function exportCSV(){
  try{
    var data=getExportModels();
    var rows=[['Codigo','Descripcion','Unidades','Cajas']];
    for(var i=0;i<data.length;i++){var m=data[i];rows.push([m.codigo||'',m.descripcion||'',m.stock||0,m.cajas||0]);}
    var csv=rows.map(function(r){return r.map(function(c){var s=String(c);return s.indexOf(',')!==-1||s.indexOf('"')!==-1||s.indexOf('\n')!==-1?'"'+s.replace(/"/g,'""')+'"':s;}).join(',');}).join('\r\n');
    var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='catalogo-picaportes-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    showToast('CSV exportado ('+data.length+' picaportes)');
  }catch(e){showToast('Error al exportar CSV');}
}

// ===== EXPORT FOTOS ZIP =====
function exportFotos(){
  var conFoto=models.filter(function(m){return !!m.photo;});
  if(conFoto.length===0){showToast('No hay fotos cargadas');return;}
  showToast('Generando ZIP...');
  // Load JSZip dynamically
  if(typeof JSZip==='undefined'){
    var script=document.createElement('script');
    script.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    script.onload=function(){_buildFotosZip(conFoto);};
    script.onerror=function(){showToast('Error al cargar JSZip');};
    document.head.appendChild(script);
  } else {
    _buildFotosZip(conFoto);
  }
}
function _buildFotosZip(items){
  var zip=new JSZip();
  for(var i=0;i<items.length;i++){
    var m=items[i];
    var base64=m.photo;
    // Strip data:image/xxx;base64, prefix
    var parts=base64.match(/^data:image\/(\w+);base64,(.+)$/);
    if(!parts) continue;
    var ext=parts[1]==='jpeg'?'jpg':parts[1];
    var data=parts[2];
    var cod=(m.codigo||'').replace(/[^a-zA-Z0-9]/g,'');
    var desc=(m.descripcion||'picaporte').replace(/[^a-zA-Z0-9 _-]/g,'').trim().replace(/\s+/g,'_').slice(0,40);
    var filename=(cod?cod+'_':'')+desc+'.'+ext;
    zip.file(filename, data, {base64:true});
  }
  zip.generateAsync({type:'blob'}).then(function(blob){
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download='fotos-picaportes-'+new Date().toISOString().slice(0,10)+'.zip';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    showToast('ZIP descargado ('+items.length+' foto'+(items.length!==1?'s':'')+')');
  }).catch(function(e){showToast('Error al generar ZIP: '+e.message);});
}

  setTimeout(function(){t.className='toast';},2500);
}

// ===== KEYBOARD =====
document.addEventListener('keydown',function(e){
  var tag=(document.activeElement||{}).tagName||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();performUndo();}
  else if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();performRedo();}
});
