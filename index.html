<style>
:root {
  --bg: #0f0f0f;
  --bg2: #181818;
  --bg3: #222;
  --border: #2e2e2e;
  --accent: #c8621a;
  --al: #e0741f;
  --text: #e8e0d8;
  --muted: #7a7268;
  --dim: #4a4540;
  --tbg: #2a2218;
}

body.light {
  --bg: #f4f1ed;
  --bg2: #fff;
  --bg3: #ede9e3;
  --border: #d8d2c8;
  --text: #2a2218;
  --muted: #7a6a58;
  --dim: #b0a090;
  --tbg: #f0ebe3;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── LAYOUT ── */
.page {
  max-width: 560px;
  margin: 0 auto;
  width: 100%;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.header {
  padding: 36px 20px 28px;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.header-eyebrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-eyebrow::before {
  content: '';
  display: inline-block;
  width: 14px;
  height: 1px;
  background: var(--accent);
}

.header-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text);
  text-transform: uppercase;
  line-height: 1;
  margin-bottom: 6px;
}

.header-title span { color: var(--accent); }

.header-sub {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.04em;
}

.header-actions {
  position: absolute;
  top: 20px;
  right: 20px;
  display: flex;
  gap: 6px;
  align-items: center;
}

.theme-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 4px;
  width: 30px;
  height: 30px;
  cursor: pointer;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
}
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }

.logout-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 4px;
  height: 30px;
  padding: 0 10px;
  cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  transition: all .15s;
}
.logout-btn:hover { border-color: #c0392b; color: #c0392b; }

/* ── CATALOG GRID ── */
.section-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 20px 20px 10px;
}

.catalog-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 0 12px;
}

/* ── CATALOG CARD ── */
.catalog-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  text-decoration: none;
  color: var(--text);
  transition: border-color .15s, background .15s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.catalog-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: transparent;
  transition: background .15s;
  border-radius: 3px 0 0 3px;
}

.catalog-card:hover { border-color: var(--accent); background: var(--tbg); }
.catalog-card:hover::before { background: var(--accent); }

.catalog-icon {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.catalog-icon svg {
  width: 32px;
  height: 32px;
  opacity: 0.6;
  transition: opacity .15s;
}

.catalog-card:hover .catalog-icon svg { opacity: 1; }

.catalog-info { flex: 1; min-width: 0; }

.catalog-name {
  font-family: 'Rajdhani', sans-serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text);
  line-height: 1;
  transition: color .15s;
}

.catalog-card:hover .catalog-name { color: var(--accent); }

.catalog-arrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  color: var(--dim);
  flex-shrink: 0;
  transition: color .15s, transform .15s;
}

.catalog-card:hover .catalog-arrow { color: var(--accent); transform: translateX(3px); }

/* ── FOOTER ── */
.footer {
  padding: 20px;
  margin-top: auto;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.footer-brand {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--dim);
}

.footer-version {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  color: var(--dim);
}

/* ── LOGIN SCREEN ── */
#login-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--bg);
  align-items: center;
  justify-content: center;
  padding: 24px;
}

#login-screen.visible { display: flex; }

.login-box {
  width: 100%;
  max-width: 360px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.login-eyebrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.login-eyebrow::before {
  content: '';
  display: inline-block;
  width: 14px;
  height: 1px;
  background: var(--accent);
}

.login-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1;
  margin-bottom: 28px;
}

.login-title span { color: var(--accent); }

.login-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 12px;
}

.login-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.login-input {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 10px 12px;
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color .15s;
}

.login-input:focus { border-color: var(--accent); }
.login-input::placeholder { color: var(--dim); }

.login-btn {
  margin-top: 8px;
  background: var(--accent);
  border: none;
  border-radius: 5px;
  padding: 11px;
  color: #fff;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background .15s;
}

.login-btn:hover { background: var(--al); }
.login-btn:disabled { opacity: 0.5; cursor: default; }

.consulta-btn {
  margin-top: 8px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 10px;
  color: var(--muted);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color .15s, color .15s;
}
.consulta-btn:hover { border-color: var(--dim); color: var(--text); }

.login-error {
  margin-top: 10px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 600;
  color: #c0392b;
  letter-spacing: 0.04em;
  min-height: 16px;
  text-align: center;
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ocultar ambas vistas hasta que JS decida cuál mostrar */
#login-screen { display: none; }
#login-screen.visible { display: flex !important; }
#catalog-page { display: none; }
#catalog-page.visible { display: flex !important; }
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-eyebrow">Sistema de Catálogos</div>
    <div class="login-title">Aberturas <span>Torri</span></div>
    <div class="login-field">
      <div class="login-label">Email</div>
      <input class="login-input" id="login-email" type="email" placeholder="usuario@email.com" autocomplete="email">
    </div>
    <div class="login-field">
      <div class="login-label">Contraseña</div>
      <input class="login-input" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Ingresar</button>
    <button class="consulta-btn" onclick="doConsulta()">Solo consultar</button>

<!-- ===== CATALOG PAGE ===== -->

  <div class="catalog-list">

          <rect x="4" y="12" width="16" height="8" rx="4" stroke="#c8621a" stroke-width="2"/>
          <rect x="17" y="14.5" width="10" height="3" rx="1.5" fill="#c8621a"/>

          <line x1="4" y1="20" x2="4" y2="27" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>

  </div>

  <div class="footer">
    <div class="footer-brand">Aberturas Torri</div>
    <div class="footer-version">v1.0 — 2025</div>
  </div>

</div>

<script>
var SUPABASE_URL = 'https://ddowemygrrbjoqkyguhq.supabase.co';
var SUPABASE_KEY = 'sb_publishable_TF6bRm78aN2sWLKSLIiObg_1fKt5oQb';

var darkMode = true;
try { var t = localStorage.getItem('torri_theme'); if(t === 'light') { darkMode = false; document.body.classList.add('light'); } } catch(e) {}

function toggleTheme() {
  darkMode = !darkMode;
  document.body.classList.toggle('light', !darkMode);
  try { localStorage.setItem('torri_theme', darkMode ? 'dark' : 'light'); } catch(e) {}
}

// ── AUTH ──
var SESSION_DURATION_MS = 8 * 60 * 60 * 1000; // 8 horas

function checkSession() {
  var session = null;
  var mode = null;
  var sessionTime = null;
  try { session = localStorage.getItem('torri_session'); } catch(e) {}
  try { mode = localStorage.getItem('torri_mode'); } catch(e) {}
  try { sessionTime = localStorage.getItem('torri_session_time'); } catch(e) {}

  var hasValidWindow = sessionTime && (Date.now() - parseInt(sessionTime, 10)) < SESSION_DURATION_MS;

  if ((session || mode === 'consulta') && hasValidWindow) {
    showCatalog();
  } else {
    try {
      localStorage.removeItem('torri_session');
      localStorage.removeItem('torri_mode');
      localStorage.removeItem('torri_session_time');
    } catch(e) {}
    showLogin();
  }
}

function showLogin() {
  document.getElementById('login-screen').classList.add('visible');
  document.getElementById('catalog-page').classList.remove('visible');
  // Precargar credenciales guardadas
  try {
    var savedEmail = localStorage.getItem('torri_saved_email');
    var savedPassword = localStorage.getItem('torri_saved_password');
    if (savedEmail) document.getElementById('login-email').value = savedEmail;
    if (savedPassword) document.getElementById('login-password').value = savedPassword;
  } catch(e) {}
}

function showCatalog() {
  document.getElementById('login-screen').classList.remove('visible');
  document.getElementById('catalog-page').classList.add('visible');
}

function setLoginError(msg) {
  document.getElementById('login-error').textContent = msg || '';
}

function doLogin() {
  var email = document.getElementById('login-email').value.trim();
  var password = document.getElementById('login-password').value;
  var btn = document.getElementById('login-btn');

  if (!email || !password) { setLoginError('Completá email y contraseña.'); return; }

  btn.disabled = true;
  btn.textContent = 'Ingresando...';
  setLoginError('');

  fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY
    },
    body: JSON.stringify({ email: email, password: password })
  })
  .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
  .then(function(result) {
    btn.disabled = false;
    btn.textContent = 'Ingresar';
    if (result.ok && result.data.access_token) {
      try {
        localStorage.setItem('torri_session', result.data.access_token);
        localStorage.setItem('torri_saved_email', email);
        localStorage.setItem('torri_saved_password', password);
        localStorage.setItem('torri_mode', 'completo');
        localStorage.setItem('torri_session_time', Date.now().toString());
      } catch(e) {}
      showCatalog();
    } else {
      var msg = (result.data && result.data.error_description) || (result.data && result.data.msg) || 'Credenciales incorrectas.';
      setLoginError(msg);
    }
  })
  .catch(function() {
    btn.disabled = false;
    btn.textContent = 'Ingresar';
    setLoginError('Error de conexión. Verificá tu internet.');
  });
}

function doConsulta() {
  try {
    localStorage.setItem('torri_mode', 'consulta');
    localStorage.setItem('torri_session_time', Date.now().toString());
  } catch(e) {}
  showCatalog();
}

function doLogout() {
  try {
    localStorage.removeItem('torri_session');
    localStorage.removeItem('torri_mode');
    localStorage.removeItem('torri_session_time');
  } catch(e) {}
  showLogin();
}

// Enter en cualquier campo del login
document.getElementById('login-email').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('login-password').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });

// ── INIT ──
checkSession();
</script>
